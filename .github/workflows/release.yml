name: release

# Al subir una etiqueta vX.Y.Z: compila el paquete de Arch (PKGBUILD, con sus pruebas en check())
# y lo adjunta a la versión de GitHub. Crisol avisa desde la app y lo instala con pacman -U.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git github-cli python python-gobject python-requests \
            gtk4 libadwaita libsecret libarchive desktop-file-utils xdg-utils
      - uses: actions/checkout@v4
      - name: Check the version matches the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^pkgver=$v$" PKGBUILD || { echo "PKGBUILD pkgver != $v"; exit 1; }
          grep -q "^VERSION = \"$v\"$" crisol/__init__.py || { echo "crisol/__init__.py VERSION != $v"; exit 1; }
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder: .
          su builder -c "makepkg -f --noconfirm"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          gh release create "$GITHUB_REF_NAME" crisol-*.pkg.tar.zst --title "Crisol ${GITHUB_REF_NAME#v}" \
            --notes "Install or update: download the .pkg.tar.zst and run \`sudo pacman -U crisol-*.pkg.tar.zst\` — or let Crisol do it (it shows a notice when a new version is out)."
